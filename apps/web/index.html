<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>率土 · 资源管理</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="tag">率土配将助手 · 本地版</span><h1>先整理资源，再从容配将。</h1><p>维护账号资源，连接模型获取配将建议。自动扫描待接入。</p></div><span class="badge">MySQL 本地存储</span></header>
<main><p id="message" role="status"></p><section class="toolbar"><label>当前角色<select id="roles"><option value="">请先新建角色</option></select></label><button id="newRole">新建角色</button><button id="editRole">修改角色 / 赛季</button><button id="export">导出当前角色</button><label class="file">导入备份<input id="import" type="file" accept=".json,application/json"></label></section>
<p id="roleInfo"></p><nav><button data-kind="general" class="active">武将</button><button data-kind="tactic">战法</button><button data-kind="treasure">宝物</button></nav>
<section class="toolbar"><input id="search" placeholder="搜索资源名称" aria-label="搜索资源名称"><button id="add" class="primary">新增资源</button><span id="count"></span></section>
<section class="panel"><table><thead><tr><th>名称</th><th>属性</th><th>核对状态</th><th>操作</th></tr></thead><tbody id="resources"></tbody></table><p id="empty">新建角色后，添加你的第一条资源。</p></section><p class="muted">导入会创建独立角色副本，不覆盖已有数据。请定期导出备份。这里仅保存你录入的资源，不代表已扫描完整。</p></main>
<dialog id="roleDialog"><form id="roleForm"><h2 id="roleTitle">新建角色</h2><label>角色名称<input name="name" required maxlength="120"></label><label>服务器<input name="server" maxlength="120"></label><label>赛季 / 剧本<input name="season" maxlength="120" placeholder="例如 S1 / 征服赛季·具体剧本"></label><footer><button type="button" data-close="roleDialog">取消</button><button class="primary">保存</button></footer></form></dialog>
<dialog id="resourceDialog"><form id="resourceForm"><h2 id="resourceTitle">新增资源</h2><label>名称<input name="name" required maxlength="120"></label><div id="fields"></div><label>其他属性（JSON 对象，可留空）<textarea name="extra" rows="4" placeholder='例如 {"阵营":"蜀"}'></textarea></label><label class="check"><input type="checkbox" name="verified">我已核对这条资源</label><p>不清楚的属性留空，不会自动填成 0。</p><footer><button type="button" data-close="resourceDialog">取消</button><button class="primary">保存</button></footer></form></dialog><script src="/app.js" type="module"></script></body></html>
